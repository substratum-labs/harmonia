name: Formal foundations
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain pin
        run: test "$(cat lean-toolchain)" = "leanprover/lean4:v4.16.0"
      - name: Build
        run: lake build
      - name: Formal regression probes
        run: lake build foundationsTest
      - name: Certified comprehensive theorem axiom audit
        run: lake build foundationsAudit
      - name: Isolated adversarial audit rejection tests
        run: lake build foundationsAuditRejection
      - name: Verify running Lean version
        run: lake env lean --version | grep -F 'version 4.16.0,'
      - name: Distributed source and import inventory
        run: python3 scripts/check_distributed_audit.py --self-test && python3 scripts/check_distributed_audit.py
      - name: Distributed formal regression probes
        run: lake build distributedTest
      - name: Distributed certified axiom audit
        run: lake build distributedAudit
      - name: Distributed adversarial audit rejection probes
        run: lake build distributedAuditRejection
      - name: Kadmos World source and root inventory
        run: python3 scripts/check_kadmos_world_audit.py --self-test && python3 scripts/check_kadmos_world_audit.py
      - name: Kadmos World interpreter and kernel probes
        run: lake build kadmosWorldTest
      - name: Kadmos World certified axiom audit
        run: lake build kadmosWorldAudit
      - name: Kadmos World isolated adversarial audit probes
        run: lake build kadmosWorldAuditRejection
      - name: Kadmos Bridge artifact provenance and policy tests
        run: python3 scripts/check_kadmos_bridge_artifacts.py --self-test && python3 scripts/check_kadmos_bridge_artifacts.py
      - name: Kadmos Bridge source and root inventory
        run: python3 scripts/check_kadmos_bridge_audit.py --self-test && python3 scripts/check_kadmos_bridge_audit.py
      - name: Kadmos Bridge syntax, certificate and fixture probes
        run: lake build kadmosBridgeSyntaxTest kadmosBridgeCertificateTest kadmosBridgeFixturesTest
      - name: Kadmos Bridge certified axiom audit
        run: lake build kadmosBridgeAudit
      - name: Kadmos Bridge fresh axiom audit
        run: lake env lean HarmoniaTests/KadmosBridgeAxiomAudit.lean
      - name: Kadmos Bridge isolated adversarial audit probes
        run: lake build kadmosBridgeAuditRejection
      - name: Quorum theorem probes and certified audit
        run: lake build quorumTest quorumAudit quorumAuditRejection
      - name: Quorum source and axiom audit check
        run: python3 scripts/check_quorum_audit.py --self-test && python3 scripts/check_quorum_audit.py
      - name: Causal clocks theorem probes and certified audit
        run: lake build causalTest causalAudit causalAuditRejection
      - name: Causal clocks source and axiom audit check
        run: python3 scripts/test_causal_audit.py && python3 scripts/check_causal_audit.py
